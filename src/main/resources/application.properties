spring.application.name=MovieFlix
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

#Configuracoes do JPA //Hibernates
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Configurar o Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#configurando secret key para JWT
jwt.secret-key=${JWT_KEY}

#configurando o springDoc
springdoc.api-docs.path=/api/api-docs
springdoc.swagger-ui.path=/swagger/index.html